name: LSAN
on:
  push:
    paths-ignore:
      - 'doc/**'
      - '**/man/*'
      - '**.md'
      - '**.rdoc'
      - '**/.document'
      - '.*.yml'
  pull_request:
    # Do not use paths-ignore for required status checks
    # https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks#handling-skipped-but-required-checks
  merge_group:

concurrency:
  group: ${{ github.workflow }} / ${{ startsWith(github.event_name, 'pull') && github.ref_name || github.sha }}
  cancel-in-progress: ${{ startsWith(github.event_name, 'pull') }}

permissions:
  contents: read

jobs:
  make:
    env: &make-env
      GITPULLOPTIONS: --no-tags origin ${{ github.ref }}
      RUBY_DEBUG: ci
      RUBY_FREE_AT_EXIT: 1

    runs-on: ubuntu-latest

    if: >-
      ${{!(false
      || contains(github.event.head_commit.message, '[DOC]')
      || contains(github.event.pull_request.title, '[DOC]')
      || contains(github.event.pull_request.labels.*.name, 'Documentation')
      || (github.event_name == 'push' && github.event.pull_request.user.login == 'dependabot[bot]')
      )}}

    steps: &make-steps
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: /.github

      - uses: ./.github/actions/setup/ubuntu

      - uses: ruby/setup-ruby@ab177d40ee5483edb974554986f56b33477e21d0 # v1.265.0
        with:
          ruby-version: '3.1'
          bundler: none

      - uses: ./.github/actions/setup/directories
        with:
          srcdir: src
          builddir: build
          makeup: true
          clean: true
          # Set fetch-depth: 10 so that Launchable can receive commits information.
          fetch-depth: 10

      - name: Run configure
        run: >-
          $SETARCH ../src/configure -C --disable-install-doc cflags="-fsanitize=leak -fno-omit-frame-pointer" CC="clang-18" LD="clang-18" --disable-yjit --disable-zjit

      - run: $SETARCH make

      - name: make btest
        run: |
          $SETARCH make -s btest-ruby
        timeout-minutes: 5
        env:
          RUBY_TESTOPTS: '-q --tty=no'
          GNUMAKEFLAGS: ''

      - name: make test-basic
        run: |
          $SETARCH make -s test-basic
        timeout-minutes: 5
        env:
          RUBY_TESTOPTS: '-q --tty=no'
          GNUMAKEFLAGS: ''

      - name: make test-tool
        run: |
          $SETARCH make -s test-tool
        timeout-minutes: 5
        env:
          RUBY_TESTOPTS: '-q --tty=no'
          GNUMAKEFLAGS: ''

      - name: make test-all
        run: |
          $SETARCH LSAN_OPTIONS="suppressions=../src/misc/lsan_suppressions.txt:print_suppressions=false" make -s test-all
        timeout-minutes: 30
        env:
          RUBY_TESTOPTS: '-q --tty=no'
          GNUMAKEFLAGS: ''

      - name: make test-spec
        run: |
          $SETARCH make -s test-spec
        timeout-minutes: 30
        env:
          RUBY_TESTOPTS: '-q --tty=no'
          GNUMAKEFLAGS: ''

      - uses: ./.github/actions/slack
        with:
          label: LSAN
          SLACK_WEBHOOK_URL: ${{ secrets.SIMPLER_ALERTS_URL }} # ruby-lang slack: ruby/simpler-alerts-bot
        if: ${{ failure() }}

defaults:
  run:
    working-directory: build
